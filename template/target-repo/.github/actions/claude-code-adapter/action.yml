name: BuildPilot Claude Code adapter
description: Runs Claude Code Action against a BuildPilot task brief and opens a PR that closes the tracking issue.

inputs:
  brief_json:
    description: DispatchBrief.v1 JSON (goal, acceptance_criteria, constraints, context_files)
    required: true
  task_id:
    description: BuildPilot task ID (equals the tracking issue number)
    required: true
  cost_cap_usd:
    description: Dollar cap enforced by the adapter
    required: true
  base_ref:
    description: Ref to branch from
    required: true

runs:
  using: composite
  steps:
    - name: Configure git identity
      shell: bash
      run: |
        git config user.name "buildpilot[bot]"
        git config user.email "buildpilot[bot]@users.noreply.github.com"

    - name: Create working branch
      shell: bash
      run: |
        git checkout -b "bp/${{ inputs.task_id }}" "${{ inputs.base_ref }}"

    - name: Render agent prompt
      id: render
      shell: bash
      env:
        BRIEF: ${{ inputs.brief_json }}
        TASK_ID: ${{ inputs.task_id }}
        COST_CAP: ${{ inputs.cost_cap_usd }}
      run: |
        goal=$(echo "$BRIEF" | jq -r '.goal')
        criteria=$(echo "$BRIEF" | jq -r '.acceptance_criteria | map("- " + .) | join("\n")')
        constraints=$(echo "$BRIEF" | jq -r '.constraints | map("- " + .) | join("\n")')
        context_files=$(echo "$BRIEF" | jq -r '.context_files | map("- " + .) | join("\n")')
        {
          echo "prompt<<PROMPT_EOF"
          echo "You are BuildPilot's engineering agent. Complete this task and open a PR that closes issue #$TASK_ID."
          echo ""
          echo "Goal: $goal"
          echo ""
          echo "Acceptance criteria:"
          echo "$criteria"
          echo ""
          if [ -n "$constraints" ]; then
            echo "Constraints:"
            echo "$constraints"
            echo ""
          fi
          if [ -n "$context_files" ]; then
            echo "Read these files first:"
            echo "$context_files"
            echo ""
          fi
          echo "Cost cap: \$$COST_CAP. Stop and open a partial PR before exceeding this."
          echo "PROMPT_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Run Claude Code
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
        prompt: ${{ steps.render.outputs.prompt }}
        max_turns: "20"

    - name: Open pull request
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRIEF: ${{ inputs.brief_json }}
        TASK_ID: ${{ inputs.task_id }}
      run: |
        goal=$(echo "$BRIEF" | jq -r '.goal')
        # Only push+PR if the agent produced changes
        if git diff --quiet "origin/${{ inputs.base_ref }}"..HEAD; then
          echo "::warning::No changes produced by the agent — skipping PR."
          exit 0
        fi
        git push -u origin "bp/${{ inputs.task_id }}"
        gh pr create \
          --base "${{ inputs.base_ref }}" \
          --head "bp/${{ inputs.task_id }}" \
          --title "[BuildPilot #${{ inputs.task_id }}] $goal" \
          --body "Closes #${{ inputs.task_id }}"$'\n\nGenerated by BuildPilot.'
