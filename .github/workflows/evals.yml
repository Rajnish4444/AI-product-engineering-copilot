name: Evals

on:
  pull_request:
    paths:
      - "lib/prompts/**"
      - "lib/providers/**"
      - "lib/evals/**"
      - "lib/schemas/**"
      - ".github/workflows/evals.yml"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: Run eval suite (cheap tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run evals
        env:
          BUILDPILOT_PROVIDER: ${{ vars.BUILDPILOT_EVAL_PROVIDER || 'anthropic' }}
          BUILDPILOT_PROVIDER_OVERRIDE: cheap
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
        run: pnpm eval

      - name: Attach report to step summary
        if: always()
        run: |
          if [ -f eval-results/latest.md ]; then
            cat eval-results/latest.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No eval-results/latest.md produced." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload full report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results/
          if-no-files-found: warn
